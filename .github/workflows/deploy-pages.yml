name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /instituto-2630
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Place assets at the GitHub Pages root
        run: |
          mv dist/client/instituto-2630/_next dist/client/_next
          rmdir dist/client/instituto-2630
      - name: Create clean URLs for GitHub Pages
        run: |
          for page in dist/client/*.html; do
            name="$(basename "$page" .html)"
            if [ "$name" = "index" ] || [ "$name" = "404" ]; then
              continue
            fi
            mkdir -p "dist/client/$name"
            cp "$page" "dist/client/$name/index.html"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
